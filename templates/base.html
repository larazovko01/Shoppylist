<!DOCTYPE html>
<html>
<head>
    <title>ShoppyList</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <style>
        body{
            font-family:'Poppins',sans-serif;
            background-color:#faf7f8;
        }
        .navbar-custom{
            background-color:#c89fa3;
        }
        .navbar-brand{
            font-weight:600;
        }
        h1,h2,h3{
            color:#6d6875;
        }
        .btn-primary{
            background-color:#b5838d;
            border-color:#b5838d;
        }
        .btn-primary:hover{
            background-color:#a36f7a;
            border-color:#a36f7a;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/">
            ShoppyList
        </a>
        <div>
            <a class="btn btn-light me-2" href="/">
                Početna
            </a>
            <a class="btn btn-light me-2" href="/liste">
                Liste
            </a>
            <a class="btn btn-light" href="/stats">
                Grafovi
            </a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
